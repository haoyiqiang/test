<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS:GO Web FPS — 3D 射击游戏</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #container canvas {
      display: block;
    }

    /* 指针锁定时隐藏光标 */
    body.locked {
      cursor: none;
    }

    /* 加载进度覆盖层 */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #loading-screen.loaded {
      opacity: 0;
      pointer-events: none;
    }

    #loading-title {
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    #loading-bar-outer {
      width: 300px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }

    #loading-bar-inner {
      width: 0%;
      height: 100%;
      background: #ff6600;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    #loading-text {
      color: #aaa;
      font-size: 14px;
      margin-top: 12px;
    }

    /* 提示覆盖层 */
    #lock-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 16px 32px;
      border-radius: 8px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }

    /* FPS 显示 (调试用) */
    #fps-display {
      position: fixed;
      top: 8px;
      right: 8px;
      color: #0f0;
      font-size: 14px;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 加载进度 -->
  <div id="loading-screen">
    <div id="loading-title">CS:GO Web FPS</div>
    <div id="loading-bar-outer">
      <div id="loading-bar-inner"></div>
    </div>
    <div id="loading-text">正在加载资源...</div>
  </div>

  <div id="container"></div>

  <div id="lock-hint">点击画面开始游戏</div>
  <div id="fps-display">FPS: --</div>

  <!-- importmap: 模块路径映射 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "csgo/": "./src/"
    }
  }
  </script>

  <!-- 游戏入口 -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
