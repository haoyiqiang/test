<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS:GO Style — Slice 2 武器系统</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #container canvas {
      display: block;
    }

    /* 指针锁定时隐藏光标 */
    body.locked {
      cursor: none;
    }

    /* 提示覆盖层 */
    #lock-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 16px 32px;
      border-radius: 8px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }

    /* FPS 显示 (调试用) */
    #fps-display {
      position: fixed;
      top: 8px;
      right: 8px;
      color: #0f0;
      font-size: 14px;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }

    /* ── HUD 元素 ──────────────────────────────────── */

    /* 准星 */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      background: rgba(0, 255, 0, 0.8);
      border-radius: 50%;
      pointer-events: none;
      user-select: none;
      z-index: 20;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0, 255, 0, 0.6);
    }

    #crosshair::before {
      top: 50%;
      left: -12px;
      width: 28px;
      height: 1px;
      transform: translateY(-50%);
    }

    #crosshair::after {
      left: 50%;
      top: -12px;
      width: 1px;
      height: 28px;
      transform: translateX(-50%);
    }

    /* 底部 HUD 面板 */
    #hud-bottom {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      user-select: none;
      z-index: 20;
    }

    /* 武器槽位条 */
    #weapon-slots {
      display: flex;
      gap: 6px;
    }

    .weapon-slot {
      width: 100px;
      height: 36px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
    }

    .weapon-slot.filled {
      color: rgba(255, 255, 255, 0.8);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .weapon-slot.active {
      color: #fff;
      border-color: #0f0;
      background: rgba(0, 255, 0, 0.1);
    }

    /* 弹药与武器信息 */
    #ammo-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: monospace;
      color: #fff;
    }

    #weapon-name {
      font-size: 18px;
      font-weight: bold;
      min-width: 100px;
      text-align: right;
    }

    #ammo-display {
      font-size: 28px;
      font-weight: bold;
    }

    /* 换弹进度条 */
    #reload-bar-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    #reload-bar {
      display: none;
      width: 100%;
      height: 100%;
      background: #ff0;
      animation: reloadAnim 2.5s linear infinite;
    }

    @keyframes reloadAnim {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* 金钱显示 */
    #money-display {
      position: fixed;
      top: 8px;
      left: 8px;
      color: #0f0;
      font-size: 18px;
      font-family: monospace;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 12px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="container"></div>

  <div id="lock-hint">点击画面开始游戏</div>
  <div id="fps-display">FPS: --</div>
  <!-- HUD: 准星 -->
  <div id="crosshair"></div>

  <!-- HUD: 金钱 -->
  <div id="money-display">$800</div>

  <!-- HUD: 底部面板 -->
  <div id="hud-bottom">
    <div id="weapon-slots">
      <div class="weapon-slot filled active" id="weapon-slot-1">USP-S</div>
      <div class="weapon-slot" id="weapon-slot-2"></div>
      <div class="weapon-slot" id="weapon-slot-3"></div>
      <div class="weapon-slot" id="weapon-slot-4"></div>
      <div class="weapon-slot" id="weapon-slot-5"></div>
    </div>
    <div id="ammo-panel">
      <span id="weapon-name">USP-S</span>
      <span id="ammo-display">12 / 24</span>
    </div>
    <div id="reload-bar-container">
      <div id="reload-bar"></div>
    </div>
  </div>

  <!-- importmap: 模块路径映射 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "csgo/": "./src/"
    }
  }
  </script>

  <!-- 游戏入口 -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
